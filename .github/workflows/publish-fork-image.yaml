name: Build & Publish Fork Image

# Publishes an image from this fork, which carries fixes that are not upstream
# yet. See UPSTREAM.md for what diverges and why.
#
# Two tags are pushed for every build:
#
#   <tag>            the one to put in a compose file
#   <tag>-<sha>      immutable, so a rollback can name the exact commit
#
# "latest" is deliberately never touched: on a fork it is an invitation to
# deploy something unvalidated by accident.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA or branch to build from
        required: true
        default: main
      tag:
        description: >
          Version tag, without a leading v. The scheme is
          <upstream-version>-<fork-version>, e.g. 0.5.1-0.1.0
        required: true
      image:
        description: Docker Hub repository to push to
        required: true
        default: tuanmedeiros/pgbackweb

jobs:
  build-and-push-images:
    strategy:
      matrix:
        vars:
          [
            { os: ubuntu-24.04, platform: amd64 },
            { os: ubuntu-24.04-arm, platform: arm64 },
          ]

    name: Build and push ${{ matrix.vars.platform }}
    # Each architecture builds on its own native runner, so nothing is emulated.
    runs-on: ${{ matrix.vars.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit }}
          # set-version.sh needs no history, but a full clone makes the short
          # SHA below match what `git rev-parse` gives locally.
          fetch-depth: 0

      - name: Resolve short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stamp the version
        run: |
          chmod +x ./scripts/set-version.sh
          ./scripts/set-version.sh v${{ github.event.inputs.tag }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build the image
        run: >
          docker build
          --tag ${{ github.event.inputs.image }}:${{ github.event.inputs.tag }}-${{ matrix.vars.platform }}
          --tag ${{ github.event.inputs.image }}:${{ github.event.inputs.tag }}-${{ steps.sha.outputs.short }}-${{ matrix.vars.platform }}
          --build-arg TARGETPLATFORM=linux/${{ matrix.vars.platform }}
          --file docker/Dockerfile .

      - name: Push the image
        run: |
          docker push ${{ github.event.inputs.image }}:${{ github.event.inputs.tag }}-${{ matrix.vars.platform }}
          docker push ${{ github.event.inputs.image }}:${{ github.event.inputs.tag }}-${{ steps.sha.outputs.short }}-${{ matrix.vars.platform }}

  merge-and-push-manifest:
    name: Merge manifests
    needs: build-and-push-images
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit }}
          fetch-depth: 0

      - name: Resolve short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      # A manifest lets one tag serve both architectures, so the VPS pulls the
      # right one without knowing which it needs.
      - name: Merge and push manifests
        env:
          IMAGE: ${{ github.event.inputs.image }}
          TAG: ${{ github.event.inputs.tag }}
          SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail

          for name in "$TAG" "$TAG-$SHA"; do
            docker manifest create "$IMAGE:$name" \
              "$IMAGE:$name-amd64" \
              "$IMAGE:$name-arm64"

            docker manifest push "$IMAGE:$name"
            echo "pushed $IMAGE:$name"
          done

      - name: Summary
        env:
          IMAGE: ${{ github.event.inputs.image }}
          TAG: ${{ github.event.inputs.tag }}
          SHA: ${{ steps.sha.outputs.short }}
        run: |
          {
            echo "### Published"
            echo
            echo '| Tag | Use |'
            echo '| --- | --- |'
            echo "| \`$IMAGE:$TAG\` | put this in the compose file |"
            echo "| \`$IMAGE:$TAG-$SHA\` | immutable, name it to roll back |"
            echo
            echo "Built from \`${{ github.event.inputs.commit }}\` at \`$SHA\`."
            echo
            echo 'Not tagged `latest` — see UPSTREAM.md.'
          } >> "$GITHUB_STEP_SUMMARY"
