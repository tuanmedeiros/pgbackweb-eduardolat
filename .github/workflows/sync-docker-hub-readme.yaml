name: Sync Docker Hub README

# Keeps the Docker Hub description of this fork's image in step with README.md.
#
# Retargeted from eduardolat/pgbackweb: inherited from upstream, it pushed this
# repository's README onto someone else's Docker Hub listing. It only ever failed,
# because the credentials for that account are not here — but a workflow that
# writes to a repository you do not own is not something to leave armed.

on:
  push:
    branches:
      - main
    paths:
      - README.md
  workflow_dispatch:

# Nothing here needs the token for anything but cloning.
permissions:
  contents: read

jobs:
  run_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # This job reads one file and never talks to the remote again.
          persist-credentials: false

      - name: Sync Docker Hub README
        uses: ms-jpq/sync-dockerhub-readme@v1
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          # Upstream used DOCKERHUB_PASS, which does not exist in this fork. The
          # access token the publish workflow already uses works here too, and is
          # revocable without touching the account password.
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
          repository: tuanmedeiros/pgbackweb
          readme: "./README.md"
